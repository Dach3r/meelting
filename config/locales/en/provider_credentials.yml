en:
  activerecord:
    attributes:
      provider_credential:
        api_key: "API key"
    errors:
      models:
        provider_credential:
          attributes:
            api_key:
              rejected: "was rejected by the provider. Check that it is complete and active."
  provider_credentials:
    providers:
      deepseek: "DeepSeek"
    status:
      none: "No model key. Agents cannot run."
      valid: "%{provider}: verified"
      unverified: "%{provider}: unverified (the provider did not respond)"
      invalid: "%{provider}: rejected by the provider"
    actions:
      add: "Add"
      replace: "Replace"
      remove: "Remove"
    new:
      title: "Add a model key"
      lead: "For now Meelting uses DeepSeek. Your key is encrypted and only your agents use it."
      api_key: "DeepSeek API key"
      api_key_placeholder: "sk-..."
      hint: "On save, Meelting checks it by listing DeepSeek models."
      submit: "Save and verify"
    create:
      valid: "Model key verified."
      unverified: "Model key saved, but DeepSeek did not answer in time. It stays unverified; save it again to retry."
      rate_limited: "Too many attempts. Wait a few minutes."
    destroy:
      destroyed: "Model key removed."
